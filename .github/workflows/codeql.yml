name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '39 18 * * 3'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.3
      with:
        languages: ${{ matrix.language }}
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: |
          11.x
          10.x
          9.x
    - name: Restore dependencies
      run: dotnet restore --no-cache -f -v minimal
    - name: Build
      run: dotnet build -c Release -v minimal --no-restore --no-self-contained
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.3
