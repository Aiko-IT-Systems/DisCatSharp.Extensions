name: "Release DisCatSharp Extensions"

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Version Suffix"
        required: false
        type: string
      release_as_prerelease:
        description: "Release as pre-release"
        required: true
        default: true
        type: boolean

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: true

jobs:
  release:
    timeout-minutes: 30
    runs-on: windows-latest
    name: Build library and release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: |
            11.x
            10.x
            9.x
      - name: Restore dependencies
        run: dotnet restore --no-cache -f -v minimal
      - name: Build library as full release
        if: ${{!inputs.release_as_prerelease}}
        shell: pwsh
        run: ./rebuild-lib.ps1 -ArtifactLocation ./dcs-artifacts -Configuration Release
      - name: Build library as pre-release
        if: ${{inputs.release_as_prerelease}}
        shell: pwsh
        run: ./rebuild-lib.ps1 -ArtifactLocation ./dcs-artifacts -Configuration Release -VersionSuffix ${{github.event.inputs.version_suffix}}
      - name: Remove invalid packages
        shell: pwsh
        run: rm *.symbols.*
        working-directory: ./dcs-artifacts
      - name: Publish to NuGet
        shell: pwsh
        run: dotnet nuget push --source https://api.nuget.org/v3/index.json -k ${{secrets.NUGET_API_KEY}} * --skip-duplicate
        working-directory: ./dcs-artifacts
      - name: Publish to GitHub Packages
        shell: pwsh
        run: dotnet nuget push --source https://nuget.pkg.github.com/Aiko-IT-Systems/index.json -k ${{secrets.GITHUB_TOKEN}} *
        working-directory: ./dcs-artifacts
      - name: Summarize OAuth2Web NuGet deprecation follow-up
        if: ${{ success() }}
        shell: pwsh
        run: |
          @"
          ## OAuth2Web NuGet deprecation follow-up

          If this release published `DisCatSharp.Extensions.OAuth2Web`, sign in to nuget.org as a package owner and open **Manage Packages** -> **Deprecation** for `DisCatSharp.Extensions.OAuth2Web`.

          - Select all versions that should remain deprecated.
          - Reason: `Legacy`
          - Alternate package: `DisCatSharp.Hosting.AspNetCore`
          - Optional custom message: `Use DisCatSharp.Hosting.AspNetCore from the main DisCatSharp repository.`

          This follow-up requires nuget.org package owner access in the website. There is no documented `dotnet` CLI or public NuGet API flow that this workflow can rely on for the deprecation step.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
